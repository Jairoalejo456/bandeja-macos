name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build and test
        run: |
          xcodebuild test \
            -project Bandeja.xcodeproj \
            -scheme Bandeja \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/BandejaDerivedData" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
